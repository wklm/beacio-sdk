<svg xmlns="http://www.w3.org/2000/svg"
     width="820" height="160"
     viewBox="0 0 820 160"
     role="img"
     aria-label="beacio — Web Bluetooth for iPhone Safari">
  <defs>
    <!--
      Icon gradients verbatim from website-src/partials/marketing-nav.html.
      Rendered at 96×96 = 3× the nav's 32×32, preserving exact ring geometry.
    -->
    <linearGradient id="navMarkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <radialGradient id="navMarkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!--
    Colour tokens from beacio.com critical CSS (design system):
      dark  ds-text-primary:  #F5F5F7
      light ds-text:          #1D1D1F
      dark  text-secondary:   #8E8E93
      light text-secondary:   #5A5A5F  (WCAG-AA on white)
  -->
  <style>
    .wordmark { fill: #1D1D1F; }
    .tagline  { fill: #5A5A5F; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #F5F5F7; }
      .tagline  { fill: #8E8E93; }
    }
  </style>

  <!--
    Layout — centred in 820×160, measured from headless-Chrome render of
    marketing-nav.html at 3×:
      Icon 96×96  gap 30  wordmark ~171px  →  total ~297px
      Left edge of icon:  (820−297)/2 = 261.5 → 262
      Left edge of text:  262+96+30 = 388

    Vertical (lockup row only, ignoring tagline):
      Icon row:   y=24 → y=120, centre y=72
      Wordmark:   54px font, dominant-baseline=middle → y=72
      Tagline:    below icon/text row, y=144 (24px below icon bottom at y=120)
  -->

  <!-- Icon: 96×96, exact nav geometry (viewBox 100 × scale 0.96) -->
  <g transform="translate(262, 24) scale(0.96)">
    <rect width="100" height="100" rx="22" fill="url(#navMarkBg)"/>
    <circle cx="50" cy="50" r="24" fill="url(#navMarkGlow)"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#FFFFFF" stroke-width="3.0" opacity=".45"/>
    <circle cx="50" cy="50" r="22" fill="none" stroke="#FFFFFF" stroke-width="3.4" opacity=".66"/>
    <circle cx="50" cy="50" r="8.5" fill="#FFFFFF"/>
  </g>

  <!--
    Wordmark: exact font spec from beacio.com critical CSS:
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif
      font-size: 18px → 54px (3×)
      font-weight: 700
      letter-spacing: -0.02em → -1.08px at 54px
  -->
  <text
    class="wordmark"
    x="388" y="72"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="-1.08"
    dominant-baseline="middle">beacio</text>

  <!-- Tagline centred below the lockup row -->
  <text
    class="tagline"
    x="410" y="140"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="-0.32"
    text-anchor="middle"
    dominant-baseline="middle">Web Bluetooth for iPhone Safari</text>
</svg>
