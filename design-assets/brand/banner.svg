<svg xmlns="http://www.w3.org/2000/svg"
     width="820" height="160"
     viewBox="0 0 820 160"
     role="img"
     aria-label="beacio — Web Bluetooth for iPhone Safari">
  <defs>
    <!--
      Icon gradients: exact copy from website-src/partials/marketing-nav.html
    -->
    <linearGradient id="navMarkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <radialGradient id="navMarkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!--
    Horizontal lockup, centred in 820×160.

    Icon native viewBox: 0 0 100 100  →  rendered at 64×64 (scale 0.64).
    This matches the website nav's 32px icon at 2× density.

    Lockup width breakdown (measured at font-size 40, Helvetica bold):
      icon 64  +  gap 10  +  "beacio" ≈ 148px  =  222px total
    Left edge of icon: (820 − 222) / 2 = 299
    Left edge of text: 299 + 64 + 10  = 373

    Icon vertical centre: 32 + 64/2 = 64  →  text y=64, dominant-baseline=middle
  -->

  <!-- Icon — exact geometry from marketing-nav.html, scaled to 64×64 -->
  <g transform="translate(299, 32) scale(0.64)">
    <rect width="100" height="100" rx="22" fill="url(#navMarkBg)"/>
    <circle cx="50" cy="50" r="24" fill="url(#navMarkGlow)"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#FFFFFF" stroke-width="3.0" opacity=".45"/>
    <circle cx="50" cy="50" r="22" fill="none" stroke="#FFFFFF" stroke-width="3.4" opacity=".66"/>
    <circle cx="50" cy="50" r="8.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark: font-weight 700, letter-spacing −0.02em (≈ −0.8px at 40px) -->
  <text x="373" y="64"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-0.8"
        fill="#FFFFFF" dominant-baseline="middle">beacio</text>

  <!-- Tagline — centred below the lockup -->
  <text x="410" y="126"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15" font-weight="400" letter-spacing="-0.15"
        fill="#8B8B99" text-anchor="middle">Web Bluetooth for iPhone Safari</text>
</svg>
