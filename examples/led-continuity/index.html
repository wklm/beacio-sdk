<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blink an LED</title>
<style>
  :root {
    --panel: #E8EDF1; --ink: #1C2630; --muted: #5A6774; --rule: #C9D2DA;
    --bezel: #CDD5DC; --bezel-hi: #F7F9FB; --glass: #39434C; --glass-hi: #56626C;
    --amber: #FFB21C; --amber-hot: #FFE08A; --halo: rgba(255, 178, 28, .45);
    --signal: #1746B5; --on-signal: #fff; --group: #F6F8FA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #17212A; --ink: #E4EAF0; --muted: #95A3B0; --rule: #2C3944;
      --bezel: #26323C; --bezel-hi: #3A4752; --glass: #0E151B; --glass-hi: #222D36;
      --signal: #79A2FF; --on-signal: #0D1830; --group: #1E2933;
    }
  }
  :root[data-theme="dark"] {
    --panel: #17212A; --ink: #E4EAF0; --muted: #95A3B0; --rule: #2C3944;
    --bezel: #26323C; --bezel-hi: #3A4752; --glass: #0E151B; --glass-hi: #222D36;
    --signal: #79A2FF; --on-signal: #0D1830; --group: #1E2933;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--panel); color: var(--ink);
    font: 17px/1.45 -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 26rem; margin: 0 auto; overflow-x: clip; /* the halo may spill, the page may not scroll sideways */
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  h1, .word { font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0; }
  a { color: var(--signal); }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

  /* The lamp: a panel pilot light. It lights only when the LED reports 01. */
  .lamp {
    position: relative; width: min(48vw, 200px); aspect-ratio: 1; margin: 28px auto 0; padding: 7%;
    border-radius: 50%; background: radial-gradient(circle at 50% 30%, var(--bezel-hi), var(--bezel) 70%);
    box-shadow: inset 0 2px 2px rgba(255, 255, 255, .35), inset 0 -3px 6px rgba(0, 0, 0, .22), 0 14px 28px -16px rgba(0, 0, 0, .5);
  }
  .lens, .lens::after { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%; }
  .lens {
    background: radial-gradient(circle at 36% 28%, rgba(255, 255, 255, .2), transparent 26%),
                radial-gradient(circle at 50% 60%, var(--glass-hi), var(--glass) 75%);
    box-shadow: inset 0 5px 12px rgba(0, 0, 0, .55);
  }
  .lens::after {
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 90ms linear;
    background: radial-gradient(circle at 36% 28%, rgba(255, 255, 255, .7), transparent 24%),
                radial-gradient(circle at 50% 55%, var(--amber-hot), var(--amber) 52%, #C46A00);
    box-shadow: inset 0 -5px 14px rgba(150, 60, 0, .45), 0 0 36px 8px var(--halo);
  }
  .lamp::before { /* the halo that spills onto the panel */
    content: ""; position: absolute; inset: -55%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--halo), transparent); opacity: 0; transition: opacity 90ms linear;
  }
  .lamp[data-led="on"] .lens::after, .lamp[data-led="on"]::before { opacity: 1; }
  .lamp[data-led="none"] { opacity: .55; }
  .readout { text-align: center; margin: 14px 0 24px; }
  .word { display: block; font-size: 52px; font-weight: 600; line-height: 1.05; }
  .lamp[data-led="none"] + .readout .word { font-size: 22px; line-height: 2.5; color: var(--muted); }
  .readout small { font-size: 15px; color: var(--muted); }

  /* Mode choice: an iOS inset grouped list. */
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset:disabled { opacity: .5; }
  legend { font-size: 15px; color: var(--muted); padding: 0 16px 6px; }
  .group { background: var(--group); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 24px 1fr; gap: 2px 12px; padding: 14px 16px; min-height: 56px; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--rule); }
  .row input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--signal); }
  .row b { font-weight: 600; }
  .row span { grid-column: 2; font-size: 15px; color: var(--muted); }
  .row:has(input:disabled) { cursor: default; }
  .row:has(input:disabled) b { color: var(--muted); }

  footer { margin: 28px 0 0; padding: 0 16px; font-size: 15px; }
  footer a { display: block; padding: 6px 0; }

  /* The one button, in the thumb zone. */
  .dock {
    position: sticky; bottom: 0; margin: 24px -16px 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--panel) 24px);
  }
  #go {
    display: block; width: 100%; height: 56px; border: 0; border-radius: 14px;
    background: var(--signal); color: var(--on-signal); font: 600 17px/1 -apple-system, system-ui, sans-serif;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #go:active { filter: brightness(.92); }
  #go:disabled { opacity: .6; cursor: default; }
  #status { font-size: 15px; color: var(--muted); margin: 8px 4px 0; min-height: 2.9em; }
  @media (prefers-reduced-motion: reduce) { .lens::after, .lamp::before { transition: none; } }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@beacio/core@2.2.0/dist/browser.global.js"
  integrity="sha384-uK/7FDka3ATzClhOhVBY+WCXAR4CkSlXVNL/wXopCI3TyyqweWpNYiYZaji31sDd"
  crossorigin="anonymous"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <h1>Blink an LED</h1>
  <p class="lede">Start a Bluetooth LED blinking, lock your phone, and see which mode keeps it going.</p>

  <div class="lamp" id="lamp" role="img" aria-label="LED not connected" data-led="none"><span class="lens"></span></div>
  <p class="readout"><span class="word" id="word">Not connected</span> <small id="caption"></small></p>

  <fieldset id="modes" disabled>
    <legend>Who keeps it blinking?</legend>
    <div class="group">
      <label class="row">
        <input type="radio" name="mode" value="foreground" checked aria-labelledby="fg" aria-describedby="fg-d">
        <b id="fg">Foreground only</b>
        <span id="fg-d">The page sends each blink. Safari may slow or stop it when the page is hidden.</span>
      </label>
      <label class="row">
        <input type="radio" name="mode" value="background" id="bg-input" aria-labelledby="bg" aria-describedby="bg-d">
        <b id="bg">Background continuity</b>
        <span id="bg-d">beacio keeps blinking while the page is hidden or the phone is locked.</span>
      </label>
    </div>
  </fieldset>

  <footer>
    <a href="https://github.com/wklm/beacio-sdk/tree/main/examples/led-continuity#no-led-run-the-emulator">No LED? Run the emulator</a>
    <a href="https://github.com/wklm/beacio-sdk/tree/main/examples/led-continuity">Source on GitHub</a>
  </footer>

  <div class="dock">
    <button id="go" type="button">Connect</button>
    <p id="status" role="status"><span id="msg">Turn on your LED, then tap Connect.</span> <a id="setup" href="https://beacio.com/setup" hidden>Set up beacio</a></p>
  </div>
</main>
</body>
</html>
